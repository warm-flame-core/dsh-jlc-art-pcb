<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Art PCB">
  <defs>
    <linearGradient id="cu" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7c948"/>
      <stop offset="0.5" stop-color="#d4a017"/>
      <stop offset="1" stop-color="#a97c0a"/>
    </linearGradient>
  </defs>

  <!-- board body -->
  <rect x="6" y="6" width="52" height="52" rx="6" fill="#0d3b2e"/>

  <!-- copper artwork: a stylised flower / motif -->
  <g fill="url(#cu)">
    <circle cx="32" cy="27" r="7"/>
    <circle cx="32" cy="27" r="3.2" fill="#0d3b2e"/>
    <rect x="30.6" y="34" width="2.8" height="13" rx="1.4"/>
    <ellipse cx="24.5" cy="40" rx="5" ry="2.6" transform="rotate(-28 24.5 40)"/>
    <ellipse cx="39.5" cy="40" rx="5" ry="2.6" transform="rotate(28 39.5 40)"/>
  </g>

  <!-- silkscreen corner marks -->
  <g stroke="#f2f5f4" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.9">
    <path d="M13 19v-5h5"/>
    <path d="M51 19v-5h-5"/>
    <path d="M13 45v5h5"/>
    <path d="M51 45v5h-5"/>
  </g>
</svg>
